<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音乐账号管理</title>
  <link rel="stylesheet" href="/admin/assets/style.css">
  <script src="/admin/assets/app.js" defer></script>
</head>
<body>
  <main>
    <h1>音乐账号管理</h1>
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="login" hidden>
      <h2>登录管理账号</h2>
      <form id="login-form">
        <label>用户名 <input name="username" autocomplete="username" required></label>
        <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
        <label id="code-label" hidden>双重验证码 <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
        <button type="submit">登录</button>
      </form>
    </section>
    <section id="dashboard" hidden>
      <div class="heading"><h2>音源账号</h2><button type="button" id="logout">退出登录</button></div>
      <p>账号凭据保存在服务器上，不会发送到此页面。</p>
      <ul id="accounts"></ul>
      <label>扫码平台 <select id="qr-platform"><option value="netease">网易云音乐</option><option value="tencent">QQ 音乐</option><option value="kugou">酷狗音乐</option><option value="qishui">汽水音乐</option></select></label>
      <button type="button" id="create-qr">创建登录二维码</button>
      <details>
        <summary>手动添加音源账号</summary>
        <form id="account-form">
          <label>平台 <select name="platform"><option value="netease">网易云音乐</option><option value="tencent">QQ 音乐</option><option value="kugou">酷狗音乐</option><option value="qishui">汽水音乐</option></select></label>
          <label>Cookie <input type="password" name="cookie" autocomplete="off" required></label>
          <label>备注 <input name="note" maxlength="400"></label>
          <button type="submit">验证并保存</button>
        </form>
      </details>
      <section id="qr" hidden>
        <h2>扫码登录</h2>
        <p id="qr-status" role="status" aria-live="polite"></p>
        <img id="qr-image" alt="使用所选音乐 App 扫描二维码" width="256" height="256">
      </section>
      <section>
        <h2>修改管理密码</h2>
        <form id="password-form">
          <label>当前密码 <input name="oldPassword" type="password" autocomplete="current-password" required></label>
          <label>新密码 <input name="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
          <label id="password-code-label" hidden>双重验证码 <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
          <button type="submit">更新密码</button>
        </form>
        <p class="note">回滚到旧版时，旧版管理密码不会随此修改。</p>
      </section>
      <section>
        <h2>双重验证</h2>
        <p id="two-factor-status"></p>
        <button type="button" id="two-factor-setup" hidden>设置双重验证</button>
        <form id="two-factor-enable" hidden>
          <p>使用验证器扫描二维码，或手动输入密钥：<code id="two-factor-secret"></code></p>
          <img id="two-factor-image" alt="双重验证二维码" width="256" height="256">
          <label>验证码 <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
          <button type="submit">启用</button>
        </form>
        <form id="two-factor-disable" hidden>
          <label>管理密码 <input name="password" type="password" autocomplete="current-password" required></label>
          <label>验证码 <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
          <button type="submit">关闭双重验证</button>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
